<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>链接分配器</title>
    <meta name="google-site-verification" content="unrf33GALLLisewjZQGsuFmJUhKwOzvPH5G6kgn74pE" />
    <style>
        body {
            margin: 0;
            padding: 18px;
            background: #f3f6fb;
            color: #1f2937;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        h2 {
            margin: 0 0 12px;
            font-size: 18px;
            color: #1a1a2e;
        }
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d6dbe4;
            border-radius: 6px;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            background: #fff;
        }
        .topbar h1 {
            font-size: 18px;
            color: #1a1a2e;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .session-tools {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .account-pill {
            background: #dbeafe;
            color: #1d4ed8;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
        .mode-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            background: white;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .tab-button {
            flex: 1;
            padding: 8px 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            transition: all 0.2s;
        }
        .tab-button:hover {
            background: #f0f2f5;
            color: #333;
        }
        .tab-button.active {
            background: #0066cc;
            color: white;
            box-shadow: 0 2px 6px rgba(0,102,204,0.3);
        }
        .tab-content {
            display: none;
            background: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .tab-content.active {
            display: block;
        }
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-top: 8px;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background: #0051a8;
        }
        button:active {
            transform: scale(0.98);
        }
        .secondary-btn {
            background: #6c757d;
        }
        .secondary-btn:hover {
            background: #5a6268;
        }
        #output {
            margin-top: 14px;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }
        .link-box {
            background: #f8fbff;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 3px solid #0066cc;
        }
        .link-box label {
            display: block;
            font-size: 12px;
            color: #555;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .link-box input {
            width: 100%;
            padding: 7px 9px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: monospace;
            font-size: 13px;
        }
        .link-box button {
            margin-top: 7px;
            padding: 7px 14px;
            font-size: 13px;
        }
        .link-box .copy-btn {
            background: #28a745;
        }
        .link-box .copy-btn:hover {
            background: #218838;
        }
        .copy-btn {
            background: #28a745;
        }
        .copy-btn:hover {
            background: #218838;
        }
        .success-msg {
            color: #28a745;
            margin-top: 8px;
            font-size: 13px;
        }
        .info-text {
            background: #eff6ff;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #1d4ed8;
            border-left: 3px solid #93c5fd;
        }
        .panel {
            margin-top: 14px;
            border: 1px solid #e6e6e6;
            border-radius: 6px;
            background: #fafafa;
        }
        .panel h3 {
            margin-bottom: 8px;
            color: #333;
            font-size: 15px;
        }
        .mini-row {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .mini-row input {
            flex: 1;
            min-width: 160px;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 13px;
            font-family: monospace;
        }
        .mini-btn {
            margin-top: 0;
            padding: 7px 11px;
            font-size: 13px;
            white-space: nowrap;
        }
        .history-item {
            background: white;
            border: 1px solid #ececec;
            border-radius: 5px;
            padding: 8px 10px;
            margin-top: 6px;
            transition: box-shadow 0.2s;
        }
        .history-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }
        .stat-item {
            background: white;
            border: 1px solid #ececec;
            border-radius: 5px;
            padding: 8px 10px;
            margin-top: 6px;
        }
        .history-meta {
            color: #888;
            font-size: 11px;
            margin-top: 3px;
        }
        .url-preview {
            margin-top: 4px;
            word-break: break-all;
            color: #0066cc;
            font-size: 12px;
        }
        .empty-text {
            color: #888;
            font-size: 13px;
            padding: 6px 0;
        }
        .muted-note {
            margin-top: 6px;
            color: #888;
            font-size: 11px;
        }
        .sublink-editor {
            margin-top: 10px;
            border: 1px solid #e7e7e7;
            border-radius: 6px;
            background: #fff;
            padding: 10px;
        }
        .sublink-row {
            display: flex;
            gap: 6px;
            align-items: center;
            border: 1px solid #ececec;
            border-radius: 5px;
            padding: 6px 8px;
            margin-top: 6px;
        }
        .sublink-index {
            color: #888;
            font-size: 11px;
            min-width: 30px;
            text-align: center;
        }
        .sublink-url {
            flex: 1;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            color: #0d4f9c;
        }
        .danger-btn {
            background: #d9534f;
        }
        .danger-btn:hover {
            background: #c94743;
        }

        /* 折叠面板 */
        .collapsible-panel {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-top: 12px;
            overflow: hidden;
        }
        .collapsible-header {
            background: #f5f7fa;
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 14px;
            color: #333;
            user-select: none;
            transition: background 0.2s;
        }
        .collapsible-header:hover {
            background: #eef0f4;
        }
        .collapsible-header::before {
            content: '▼';
            display: inline-block;
            margin-right: 8px;
            font-size: 10px;
            transition: transform 0.25s;
            color: #666;
        }
        .collapsible-header.collapsed::before {
            transform: rotate(-90deg);
        }
        .collapsible-content {
            padding: 12px 14px;
            background: #fafafa;
            max-height: 12000px;
            overflow: hidden;
            transition: max-height 0.35s ease, padding 0.25s ease;
        }
        .collapsible-content.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
        }

        /* 用户列表表格 */
        .user-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 8px;
        }
        .user-table th {
            background: #f5f7fa;
            color: #555;
            font-weight: 600;
            padding: 7px 10px;
            text-align: left;
            border-bottom: 2px solid #e0e0e0;
        }
        .user-table td {
            padding: 7px 10px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }
        .user-table tr:last-child td {
            border-bottom: none;
        }
        .user-table tr:hover td {
            background: #fafbff;
        }
        .badge {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-green {
            background: #d1fae5;
            color: #065f46;
        }
        .badge-red {
            background: #fee2e2;
            color: #991b1b;
        }
        .badge-blue {
            background: #dbeafe;
            color: #1e40af;
        }

        /* 密码保护遮罩 */
        #auth-overlay {
            position: fixed;
            inset: 0;
            background: #f0f2f5;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #auth-overlay .auth-box {
            background: white;
            padding: 32px 28px;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            width: 100%;
            max-width: 340px;
            text-align: center;
        }
        #auth-overlay .auth-box h2 {
            margin-bottom: 6px;
            color: #1a1a2e;
            font-size: 20px;
        }
        #auth-overlay .auth-box p {
            color: #666;
            font-size: 13px;
            margin-bottom: 16px;
        }
        #auth-overlay .auth-tip {
            font-size: 11px;
            color: #999;
            margin-top: -8px;
            margin-bottom: 14px;
        }
        #auth-overlay .auth-box input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        #auth-overlay .auth-box input:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }
        #auth-overlay .auth-box button {
            width: 100%;
            margin-top: 0;
            padding: 10px;
            font-size: 15px;
        }
        #auth-error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 8px;
            min-height: 16px;
        }
        @media (max-width: 640px) {
            body { padding: 10px; }
            .topbar {
                flex-direction: column;
                align-items: stretch;
            }
            .session-tools {
                justify-content: space-between;
            }
            .user-table th:nth-child(3),
            .user-table td:nth-child(3) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 注册/登录遮罩 -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2 id="auth-title">🔒 登录</h2>
            <div id="auth-tip" class="auth-tip">首次注册的账号将自动成为管理员</div>
            <input type="text" id="auth-username" placeholder="用户名" maxlength="32" autocomplete="username">
            <input type="password" id="auth-password" placeholder="密码" maxlength="32" autocomplete="current-password">
            <button id="auth-action-btn" onclick="handleAuthAction()">登录</button>
            <div style="margin-top:10px;">
                <a href="#" id="toggle-auth-mode" onclick="toggleAuthMode(event)">没有账号？注册</a>
            </div>
            <div id="auth-error"></div>
        </div>
    </div>

    <div class="container">
        <div class="topbar">
            <h1>🔗 链接分配器</h1>
            <div class="session-tools">
                <div id="accountInfo" class="account-pill" hidden></div>
                <button id="logoutButton" class="secondary-btn" onclick="logout()" hidden>切换密码</button>
            </div>
        </div>
        
        <div class="mode-selector">
            <button class="tab-button active" onclick="switchTab('merge')">合并链接</button>
            <button class="tab-button" onclick="switchTab('admin')" id="adminTab" hidden>账号管理</button>
            <button class="tab-button" onclick="switchTab('distribute')">分配链接</button>
        </div>

        <!-- 合并链接模式 -->
        <div id="merge" class="tab-content active">
            <h2>合并链接</h2>
            <div class="info-text">
                📌 输入多个链接，生成一个特殊URL。用户访问该URL后会按顺序获取每个链接。
            </div>
            <div style="margin-bottom: 10px;">
                <label style="display:block;font-size:13px;color:#555;font-weight:500;margin-bottom:6px;">任务名称（可选）：</label>
                <input type="text" id="mergeTaskName" placeholder="例如：5月 WhatsApp 验证分流" maxlength="120" style="width:100%;padding:9px 10px;border:1px solid #d6dbe4;border-radius:6px;font-size:14px;box-sizing:border-box;background:#fff;">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="display:block;font-size:13px;color:#555;font-weight:500;margin-bottom:6px;">生成域名（可选）：</label>
                <select id="mergeDomainSelect" style="width:100%;padding:9px 10px;border:1px solid #d6dbe4;border-radius:6px;font-size:14px;box-sizing:border-box;background:#fff;">
                    <option value="">自动使用当前站点</option>
                    <option value="https://whttapp.dev">https://whttapp.dev</option>
                    <option value="https://www.whttapp.dev">https://www.whttapp.dev</option>
                    <option value="custom">手动输入自定义域名</option>
                </select>
            </div>
            <div style="margin-bottom: 10px;">
                <label style="display:block;font-size:13px;color:#555;font-weight:500;margin-bottom:6px;">自定义域名（可选）：</label>
                <input type="text" id="mergeDomainCustom" placeholder="例如：https://abc.example.com" style="width:100%;padding:9px 10px;border:1px solid #d6dbe4;border-radius:6px;font-size:14px;box-sizing:border-box;background:#fff;">
            </div>
            <textarea id="mergeInput" rows="6" placeholder="输入链接，每行一个，例如：
https://wa.me/123?text=START
https://wa.me/456?text=START
https://wa.me/789?text=START" oninput="renderMergeLinkRows()"></textarea>
            <div id="mergeLinkRows" style="margin:8px 0;"></div>
            <button onclick="mergeLinks()">生成合并链接</button>
            <div id="mergeOutput"></div>

            <!-- 历史记录（可折叠） -->
            <div class="collapsible-panel">
                <div class="collapsible-header collapsed" onclick="togglePanel(this)">
                    <span>📋 历史记录</span>
                    <button class="mini-btn" style="margin-top:0;padding:4px 10px;font-size:12px;" onclick="event.stopPropagation();fetchHistory()">刷新</button>
                </div>
                <div class="collapsible-content collapsed">
                    <div id="historyOutput" class="empty-text">正在加载历史记录...</div>
                    <div id="sublinkEditor" class="sublink-editor" hidden>
                        <div class="mini-row" style="justify-content: space-between; align-items: center;">
                            <strong id="sublinkEditorTitle">子链接管理</strong>
                            <button class="mini-btn secondary-btn" onclick="closeSublinkEditor()">关闭</button>
                        </div>
                        <div style="margin-top: 8px;">
                            <label style="font-size:12px;color:#555;font-weight:500;">链接集合名称（可选）：</label>
                            <input type="text" id="sublinkEditorName" placeholder="例如：WhatsApp 营销链接" maxlength="120" style="width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 13px; margin-top: 4px;">
                        </div>
                        <div class="muted-note">历史合并链接不会被修改或删除。你在这里编辑的是副本，保存后会生成一个新的合并链接。</div>
                        <div class="mini-row" style="margin-top: 8px;">
                            <button class="mini-btn" onclick="addSublink()">新增子链接</button>
                            <button class="mini-btn" onclick="saveSublinkEdit()">保存修改</button>
                        </div>
                        <div id="sublinkList" class="empty-text">请选择一个历史任务。</div>
                    </div>
                    <div class="muted-note">说明：历史生成记录永久保留，不支持删除历史任务。</div>
                </div>
            </div>

            <!-- 点击统计（可折叠） -->
            <div class="collapsible-panel">
                <div class="collapsible-header collapsed" onclick="togglePanel(this)">
                    <span>📊 点击统计</span>
                </div>
                <div class="collapsible-content collapsed">
                    <div class="mini-row" style="margin-bottom: 8px;">
                        <input id="statsIdInput" type="text" placeholder="输入合并链接ID，例如：abc123">
                        <button class="mini-btn" onclick="fetchStatsByInput()">查询统计</button>
                    </div>
                    <div id="statsOutput" class="empty-text">输入ID后可查看每个链接点击次数。</div>
                </div>
            </div>
        </div>

        <!-- 分配链接模式 -->
        <div id="distribute" class="tab-content">
            <h2>分配链接</h2>
            <div class="info-text">
                📌 粘贴已生成的合并链接，它会按顺序分配每个链接给用户。
            </div>
            <div style="margin:8px 0;display:flex;align-items:center;gap:6px;">
                <label style="font-size:13px;color:#555;white-space:nowrap;">分配额度：</label>
                <button type="button" id="minusQuotaDistribute" style="width:26px;padding:5px 0;margin-top:0;font-size:14px;">-</button>
                <input type="number" id="quotaDistribute" value="1111111" min="1" style="width:90px;text-align:center;padding:6px;border:1px solid #ddd;border-radius:5px;font-size:13px;">
                <button type="button" id="plusQuotaDistribute" style="width:26px;padding:5px 0;margin-top:0;font-size:14px;">+</button>
            </div>
            <label style="font-size:13px;color:#555;font-weight:500;">粘贴你的短链接：</label>
            <textarea id="distributeInput" rows="3" placeholder="例如：https://example.com/redirect.html#abc123" style="margin-top: 6px;"></textarea>
            <button onclick="openDistributedLink()" style="width: 100%; margin-top: 8px;">🚀 打开链接</button>
            <div id="distributeOutput" style="margin-top: 8px;"></div>
        </div>

        <!-- 账号管理模式 -->
        <div id="admin" class="tab-content">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <h2 style="margin-bottom:0;">账号管理</h2>
                <button class="mini-btn" onclick="fetchUserList()">刷新列表</button>
            </div>
            <div class="info-text">
                📌 管理员可以授权或禁用用户账号。未授权的账号无法登录。
            </div>
            <div id="userListOutput" class="empty-text">正在加载用户列表...</div>
        </div>
    </div>

    <script>
    // 登录/注册按钮事件处理
    async function handleAuthAction() {
        const username = document.getElementById('auth-username').value.trim();
        const password = document.getElementById('auth-password').value;
        const isRegister = authMode === 'register';
        if (!username || !password) {
            document.getElementById('auth-error').textContent = '请输入用户名和密码。';
            return;
        }
        document.getElementById('auth-error').textContent = '';
        try {
            if (isRegister) {
                const payload = await apiPost({ action: 'register', username, password }, { skipStoredUser: true });
                authMode = 'login';
                document.getElementById('auth-title').textContent = '🔒 登录';
                document.getElementById('auth-error').textContent = '注册成功，请登录。';
                document.getElementById('auth-action-btn').textContent = '登录';
                document.getElementById('toggle-auth-mode').textContent = '没有账号？注册';
                return;
            } else {
                const payload = await apiPost({ action: 'login', username, password }, { skipStoredUser: true });
                unlockForUser(payload.user, password);
            }
        } catch (error) {
            document.getElementById('auth-error').textContent = error.message || '登录失败';
        }
    }
    window.handleAuthAction = handleAuthAction;
        const MIGRATION_CONFIG = {
            useWorker: true,
            workerBaseUrl: '',
            legacyScriptUrl: 'https://script.google.com/macros/s/AKfycbwMYWgW6oBK1VFGhQVfdMiaE-wJU8MSGNLqvwgqvTUPsQJyZswdC_LxKTmqrv8l7IVM/exec',
            legacyPublicBaseUrl: 'https://wshataps.org/'
        };
        const AUTH_STORAGE_KEY = 'link_dispatch_user';
        let currentUser = null;
        const historySetMap = new Map();
        let activeHistorySetId = '';
        let editableSublinks = [];
        // 分页参数
        let historyOffset = 0;
        const historyLimit = 20;
        let historyLoaded = false;
        let historyHasMore = false;

        const detectedWorkerBaseUrl = (MIGRATION_CONFIG.workerBaseUrl || window.location.origin).replace(/\/+$/, '');
        const SCRIPT_URL = MIGRATION_CONFIG.useWorker
            ? detectedWorkerBaseUrl + '/api'
            : MIGRATION_CONFIG.legacyScriptUrl;
        const PUBLIC_BASE_URL = MIGRATION_CONFIG.useWorker
            ? detectedWorkerBaseUrl + '/'
            : MIGRATION_CONFIG.legacyPublicBaseUrl;
        const SHORT_LINK_MODE = MIGRATION_CONFIG.useWorker ? 'worker' : 'legacy';

        function normalizeBaseUrl(value) {
            const trimmed = String(value || '').trim();
            if (!trimmed) {
                return PUBLIC_BASE_URL;
            }

            const normalized = /^https?:\/\//i.test(trimmed)
                ? trimmed
                : `https://${trimmed}`;

            return normalized.replace(/\/+$/, '') + '/';
        }

        function getBaseUrl() {
            const domainSelect = document.getElementById('mergeDomainSelect');
            const customDomainInput = document.getElementById('mergeDomainCustom');

            if (domainSelect && domainSelect.value && domainSelect.value !== 'custom') {
                return normalizeBaseUrl(domainSelect.value);
            }

            if (customDomainInput && customDomainInput.value.trim()) {
                return normalizeBaseUrl(customDomainInput.value);
            }

            return PUBLIC_BASE_URL;
        }

        function buildShortUrl(id) {
            const baseUrl = getBaseUrl();
            return SHORT_LINK_MODE === 'worker'
                ? baseUrl.replace(/\/+$/, '') + '/' + id
                : baseUrl + 'redirect.html#' + id;
        }

        function populateDomainOptions(domains = [], includeCurrentOrigin = !MIGRATION_CONFIG.useWorker) {
            const select = document.getElementById('mergeDomainSelect');
            if (!select) return;

            const loweredDomains = Array.from(new Set(domains.map(domain => String(domain || '').trim()).filter(Boolean)));
            const currentOrigin = window.location.origin;
            const mergedDomains = Array.from(new Set([...(includeCurrentOrigin ? [currentOrigin] : []), ...loweredDomains]));
            const previousValue = select.value || '';

            select.innerHTML = '<option value="">自动使用当前站点</option>';
            for (const domain of mergedDomains) {
                if (!domain) continue;
                const normalized = domain.replace(/\/+$/, '');
                const option = document.createElement('option');
                option.value = normalized;
                option.textContent = normalized;
                select.appendChild(option);
            }
            select.appendChild(new Option('手动输入自定义域名', 'custom'));

            if (previousValue && previousValue !== 'custom' && mergedDomains.includes(previousValue)) {
                select.value = previousValue;
            } else {
                select.value = '';
            }
        }

        async function loadDomainOptions() {
            const select = document.getElementById('mergeDomainSelect');
            if (!select) return;

            try {
                const payload = await apiPost({ action: 'getDomainOptions' }, { skipStoredUser: true });
                const serverDomains = Array.isArray(payload && payload.domains) ? payload.domains : [];
                populateDomainOptions(serverDomains);
            } catch (error) {
                populateDomainOptions([]);
            }
        }

        function getStoredUser() {
            const raw = sessionStorage.getItem(AUTH_STORAGE_KEY);
            if (!raw) return null;
            try { return JSON.parse(raw); } catch { return null; }
        }
        function setStoredUser(user) {
            sessionStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(user));
        }
        function clearStoredUser() {
            sessionStorage.removeItem(AUTH_STORAGE_KEY);
        }

        function isAuthErrorMessage(message) {
            return /unauthorized|密码|登录|用户名/i.test(String(message || ''));
        }

        async function apiPost(payload, options = {}) {
            const requestPayload = { ...payload };
            // 登录/注册不带用户信息，其他接口自动带
            if (!options.skipStoredUser && !['login','register'].includes(payload.action)) {
                const storedUser = getStoredUser();
                if (storedUser) {
                    requestPayload.username = storedUser.username;
                    requestPayload.password = storedUser.password;
                }
            }
            const postResp = await fetch(SCRIPT_URL, {
                method: 'POST',
                redirect: 'follow',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(requestPayload)
            });
            const postText = await postResp.text();
            const parsed = tryParseJson(postText);
            if (!postResp.ok) {
                const errorMessage = parsed && typeof parsed === 'object' && parsed.error
                    ? parsed.error
                    : (typeof parsed === 'string' && parsed.trim() ? parsed.trim() : '请求失败');
                throw new Error(errorMessage);
            }
            if (parsed && typeof parsed === 'object' && parsed.error) {
                throw new Error(parsed.error);
            }
            return parsed;
        }

        function tryParseJson(text) {
            try {
                return JSON.parse(text);
            } catch (e) {
                return text;
            }
        }

        function extractIdFromResponse(payload) {
            if (!payload) return null;
            if (typeof payload === 'string') {
                const trimmed = payload.trim();
                return trimmed || null;
            }

            return payload.id || payload.hash || payload.key || payload.code ||
                (payload.data && (payload.data.id || payload.data.hash || payload.data.key)) || null;
        }

        async function createOnlineSet(links, name = '') {
            const payload = await apiPost({ action: 'createSet', links, name });
            const id = extractIdFromResponse(payload);
            if (!id) {
                throw new Error('接口未返回有效ID');
            }
            return id;
        }

        function updateSessionUi(user) {
            currentUser = user || null;
            const accountInfo = document.getElementById('accountInfo');
            const logoutButton = document.getElementById('logoutButton');
            if (user) {
                accountInfo.hidden = false;
                accountInfo.textContent = user.username + (user.role === 'admin' ? '（管理员）' : '') + ' 已登录';
                logoutButton.hidden = false;
                if (user.role === 'admin') {
                    document.getElementById('adminTab').hidden = false;
                } else {
                    document.getElementById('adminTab').hidden = true;
                }
                return;
            }
            accountInfo.hidden = true;
            accountInfo.textContent = '';
            logoutButton.hidden = true;
        }

        function showLockedState(message) {
            document.getElementById('auth-overlay').style.display = 'flex';
            document.getElementById('auth-error').textContent = message || '';
            updateSessionUi(null);
            document.getElementById('historyOutput').className = 'empty-text';
            document.getElementById('historyOutput').textContent = '登录后可查看当前账号的历史记录。';
            document.getElementById('statsOutput').className = 'empty-text';
            document.getElementById('statsOutput').textContent = '登录后输入ID可查看该账号下的点击统计。';
        }

        function unlockForUser(user, password) {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('auth-error').textContent = '';
            document.getElementById('auth-username').value = '';
            document.getElementById('auth-password').value = '';
            // 存储密码用于后续接口
            setStoredUser({ username: user.username, password, role: user.role, id: user.id });
            updateSessionUi(user);
            resetHistoryState();
        }

        function handleAuthFailure(error) {
            if (!error || !isAuthErrorMessage(error.message)) {
                return false;
            }
            clearStoredUser();
            showLockedState('登录已失效，请重新登录。');
            document.getElementById('auth-username').focus();
            return true;
        }

        async function restoreLogin() {
            const storedUser = getStoredUser();
            if (!storedUser) {
                showLockedState('');
                document.getElementById('auth-username').focus();
                return;
            }
            try {
                const payload = await apiPost({ action: 'login', username: storedUser.username, password: storedUser.password }, { skipStoredUser: true });
                unlockForUser(payload.user, storedUser.password);
            } catch (error) {
                clearStoredUser();
                showLockedState('登录已失效，请重新登录。');
                document.getElementById('auth-username').focus();
            }
        }

        function logout() {
            clearStoredUser();
            document.getElementById('mergeOutput').innerHTML = '';
            document.getElementById('statsIdInput').value = '';
            document.getElementById('distributeOutput').textContent = '';
            resetHistoryState();
            showLockedState('');
            document.getElementById('auth-username').focus();
        }

        function resetHistoryState() {
            historyOffset = 0;
            historyLoaded = false;
            historyHasMore = false;
            historySetMap.clear();
            closeSublinkEditor();
            const output = document.getElementById('historyOutput');
            output.className = 'empty-text';
            output.textContent = currentUser
                ? '展开后加载当前账号的历史记录。'
                : '登录后可查看当前账号的历史记录。';
        }

        function extractHistoryItems(payload) {
            if (!payload || typeof payload !== 'object') return [];

            const direct = payload.items || payload.history || [];
            const nested = payload.data && (payload.data.items || payload.data.history) || [];
            const list = Array.isArray(direct) ? direct : (Array.isArray(nested) ? nested : []);

            return list.filter(item => item && typeof item === 'object');
        }

        function extractStats(payload) {
            if (!payload || typeof payload !== 'object') return [];

            const direct = payload.stats || payload.items || [];
            const nested = payload.data && (payload.data.stats || payload.data.items) || [];
            const list = Array.isArray(direct) ? direct : (Array.isArray(nested) ? nested : []);

            return list.map((item, idx) => {
                if (typeof item === 'string') {
                    return { index: idx, url: item, clicks: 0 };
                }
                return {
                    index: item.index != null ? item.index : idx,
                    url: item.url || item.link || item.target || '',
                    clicks: Number(item.clicks || item.count || 0)
                };
            });
        }

        async function fetchHistory(offset = 0) {
            historyOffset = offset;
            const output = document.getElementById('historyOutput');
            output.className = 'empty-text';
            output.textContent = '历史加载中...';
            historySetMap.clear();

            try {
                const payload = await apiPost({ action: 'listSets', limit: historyLimit, offset: historyOffset });
                const items = extractHistoryItems(payload);
                const payloadHasMore = payload && typeof payload === 'object' ? payload.hasMore === true : false;
                const looksLikeLegacyPageSize = items.length >= historyLimit;
                historyLoaded = true;
                historyHasMore = payloadHasMore || looksLikeLegacyPageSize;

                if (items.length === 0) {
                    output.className = 'empty-text';
                    output.textContent = historyOffset > 0 ? '这一页没有更多历史记录。' : '当前密码下暂无历史记录。';
                    return;
                }

                output.className = '';
                output.innerHTML = items.map(item => {
                    const id = item.id || item.hash || item.key || '';
                    if (id) {
                        historySetMap.set(id, item);
                    }
                    const taskName = String(item.name || '').trim();
                    const createdAt = item.createdAt || item.created_at || item.time || '-';
                    const count = item.count != null ? item.count : (Array.isArray(item.links) ? item.links.length : '-');
                    const ownerLabel = item.ownerLabel || item.owner_label || '';
                    const shortUrl = buildShortUrl(id);
                    const ownerText = ownerLabel ? ' | 归属: ' + ownerLabel : '';
                    const username = item.username || '';
                    const userRemark = item.userRemark || '';
                    const userText = username ? ` | 用户: ${username}` : '';
                    const remarkText = userRemark ? ` | 备注: ${userRemark}` : '';

                    return `
                        <div class="history-item">
                            <div><strong>ID:</strong> ${id || '(未知)'}${taskName ? ' | <strong>任务名:</strong> ' + taskName : ''}</div>
                            <div class="history-meta">创建时间: ${createdAt} | 链接数: ${count}${ownerText}${userText}${remarkText}</div>
                            <div class="url-preview">${shortUrl}</div>
                            <div class="mini-row" style="margin-top: 8px;">
                                <button class="mini-btn copy-btn" onclick="copyText('${shortUrl.replace(/'/g, "&#39;")}', this)">复制短链</button>
                                <button class="mini-btn" onclick="setStatsId('${String(id).replace(/'/g, "&#39;")}')">查看统计</button>
                                <button class="mini-btn secondary-btn" onclick="openSublinkEditor('${String(id).replace(/'/g, "&#39;")}')">管理子链接</button>
                            </div>
                        </div>
                    `;
                }).join('');

                // 分页按钮
                                const currentPage = Math.floor(historyOffset / historyLimit) + 1;
                output.innerHTML += `
                  <div style="margin-top:10px;text-align:center;">
                                        <span style="display:inline-block;margin:0 10px;color:#666;font-size:12px;">第 ${currentPage} 页</span>
                    <button class="mini-btn" onclick="fetchHistory(${Math.max(0, historyOffset - historyLimit)})" ${historyOffset === 0 ? 'disabled' : ''}>上一页</button>
                                        <button class="mini-btn" onclick="fetchHistory(${historyOffset + historyLimit})" ${historyHasMore ? '' : 'disabled'}>下一页</button>
                  </div>
                `;
            } catch (error) {
                if (handleAuthFailure(error)) {
                    return;
                }
                output.className = 'empty-text';
                output.textContent = '历史加载失败：' + error.message;
            }
        }

        function closeSublinkEditor() {
            activeHistorySetId = '';
            editableSublinks = [];
            document.getElementById('sublinkEditor').hidden = true;
            document.getElementById('sublinkList').className = 'empty-text';
            document.getElementById('sublinkList').textContent = '请选择一个历史任务。';
            document.getElementById('sublinkEditorName').value = '';
        }
        window.closeSublinkEditor = closeSublinkEditor;

        function openSublinkEditor(id) {
            const item = historySetMap.get(id);
            if (!item) {
                alert('未找到该历史任务，请先刷新历史。');
                return;
            }

            const links = Array.isArray(item.links)
                ? item.links.map(link => ({ url: String(link || '').trim(), quota: 1 })).filter(link => link.url)
                : [];

            if (links.length === 0) {
                alert('该任务暂无可编辑的子链接。');
                return;
            }

            activeHistorySetId = id;
            editableSublinks = links;

            const editor = document.getElementById('sublinkEditor');
            editor.hidden = false;
            document.getElementById('sublinkEditorTitle').textContent = '子链接管理（来源ID: ' + id + '）';
            const nameInput = document.getElementById('sublinkEditorName');
            nameInput.value = item.name || '';
            renderSublinkList();
            editor.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            nameInput.focus({ preventScroll: true });
        }
        window.openSublinkEditor = openSublinkEditor;

        function renderSublinkList() {
            const list = document.getElementById('sublinkList');
            if (!Array.isArray(editableSublinks) || editableSublinks.length === 0) {
                list.className = 'empty-text';
                list.textContent = '当前没有子链接，请先新增。';
                return;
            }

            list.className = '';
            list.innerHTML = editableSublinks.map((item, idx) => {
                const normalizedItem = {
                    url: String(item && item.url || '').trim(),
                    quota: Math.max(1, parseInt(item && item.quota, 10) || 1)
                };
                editableSublinks[idx] = normalizedItem;
                return `
                <div class="sublink-row">
                    <div class="sublink-index">#${idx}</div>
                    <div class="sublink-url">${normalizedItem.url}</div>
                    <div style="display:flex;align-items:center;gap:4px;">
                        <label>额度</label>
                        <button class="mini-btn" onclick="window.changeSublinkQuota(${idx},-1)">-</button>
                        <input type="number" value="${normalizedItem.quota}" min="1" style="width:70px;text-align:center;" onchange="window.setSublinkQuota(${idx},this.value)">
                        <button class="mini-btn" onclick="window.changeSublinkQuota(${idx},1)">+</button>
                    </div>
                    <button class="mini-btn" onclick="editSublink(${idx})">编辑</button>
                    <button class="mini-btn danger-btn" onclick="removeSublink(${idx})">删除</button>
                </div>
                `;
            }).join('');
        }

        window.changeSublinkQuota = function(idx, delta) {
            if (!editableSublinks[idx]) return;
            const item = Object.assign({}, editableSublinks[idx]);
            item.quota = Math.max(1, (parseInt(item.quota, 10) || 1) + delta);
            editableSublinks[idx] = item;
            renderSublinkList();
        };

        window.setSublinkQuota = function(idx, val) {
            if (!editableSublinks[idx]) return;
            const item = Object.assign({}, editableSublinks[idx]);
            item.quota = Math.max(1, parseInt(val, 10) || 1);
            editableSublinks[idx] = item;
        };

        function setupQuotaButtons() {
            [
                { minus: 'minusQuotaDistribute', input: 'quotaDistribute', plus: 'plusQuotaDistribute' }
            ].forEach(cfg => {
                const minus = document.getElementById(cfg.minus);
                const plus = document.getElementById(cfg.plus);
                const input = document.getElementById(cfg.input);
                if (minus && plus && input) {
                    minus.onclick = () => {
                        input.value = Math.max(1, parseInt(input.value, 10) - 1 || 1);
                    };
                    plus.onclick = () => {
                        input.value = parseInt(input.value, 10) + 1 || 1;
                    };
                }
            });
        }

        function addSublink() {
            if (!activeHistorySetId) {
                alert('请先选择一个历史任务。');
                return;
            }

            const input = prompt('请输入新的子链接（http/https）');
            if (input == null) return;

            const link = String(input || '').trim();
            if (!/^https?:\/\//i.test(link)) {
                alert('链接格式无效，请输入 http:// 或 https:// 开头的地址。');
                return;
            }

            editableSublinks.push({ url: link, quota: 1 });
            renderSublinkList();
        }
        window.addSublink = addSublink;

        function editSublink(index) {
            if (!activeHistorySetId || index < 0 || index >= editableSublinks.length) {
                return;
            }

            const currentItem = editableSublinks[index];
            const oldValue = currentItem && currentItem.url ? currentItem.url : '';
            const input = prompt('编辑子链接（http/https）', oldValue);
            if (input == null) return;

            const nextValue = String(input || '').trim();
            if (!/^https?:\/\//i.test(nextValue)) {
                alert('链接格式无效，请输入 http:// 或 https:// 开头的地址。');
                return;
            }

            editableSublinks[index] = {
                url: nextValue,
                quota: Math.max(1, parseInt(currentItem && currentItem.quota, 10) || 1)
            };
            renderSublinkList();
        }
        window.editSublink = editSublink;

        function removeSublink(index) {
            if (!activeHistorySetId || index < 0 || index >= editableSublinks.length) {
                return;
            }

            if (editableSublinks.length <= 1) {
                alert('至少保留 1 个子链接。');
                return;
            }

            const ok = confirm('确认删除这个子链接吗？');
            if (!ok) return;

            editableSublinks.splice(index, 1);
            renderSublinkList();
        }
        window.removeSublink = removeSublink;

        async function saveSublinkEdit() {
            if (!activeHistorySetId) {
                alert('请先选择一个历史任务。');
                return;
            }
            if (!Array.isArray(editableSublinks) || editableSublinks.length === 0) {
                alert('请至少保留一个子链接。');
                return;
            }
            try {
                // 实时写入数据库
                const item = historySetMap.get(activeHistorySetId);
                if (!item) {
                    alert('未找到该历史任务，请先刷新历史。');
                    return;
                }
                // 提取 URL 字符串数组（后端 sanitizeLinks 期望字符串数组）
                const links = editableSublinks.flatMap(item => {
                    const url = String(item && item.url || '').trim();
                    const quota = Math.max(1, parseInt(item && item.quota, 10) || 1);
                    if (!url) {
                        return [];
                    }
                    return Array.from({ length: quota }, () => url);
                });
                const name = document.getElementById('sublinkEditorName').value.trim();
                // 用统一的 apiPost 方法，自动带密码
                const resp = await apiPost({
                    action: 'updateSet',
                    id: activeHistorySetId,
                    links,
                    name
                });
                if (!resp || resp.error) throw new Error(resp && resp.error ? resp.error : '保存失败');
                alert('子链接修改已保存（已同步云端，历史ID未变动）');
                renderSublinkList();
                await fetchHistory();
                openSublinkEditor(activeHistorySetId);
            } catch (error) {
                alert('保存修改失败：' + error.message);
            }
        }
        window.saveSublinkEdit = saveSublinkEdit;

        async function fetchStats(id) {

                const payload = await apiPost({ action: 'getStats', id });
                const rows = extractStats(payload);

                if (rows.length === 0) {
                    output.className = 'empty-text';
                    output.textContent = '当前密码下暂无统计数据。';
                    return;
                }

                output.className = '';
                output.innerHTML = rows.map(row => `
                    <div class="stat-item">

                    </div>
                `).join('');

                output.className = 'empty-text';

            }

        async function mergeLinks() {
            try {
                const input = document.getElementById('mergeInput').value.trim();
                if (!input) {
                    alert('请输入至少一个链接！');
                    return;
                }

                const rawLines = input.split('\n').map(l => l.trim()).filter(l => l.startsWith('http'));
                if (rawLines.length === 0) {
                    alert('未找到有效的链接！请确保每个链接都以http://或https://开头');
                    return;
                }

                // 收集每行的 quota 和 name
                const container = document.getElementById('mergeLinkRows');
                const rows = container.querySelectorAll('.merge-link-row');

                // 构建最终链接数组（按 quota 重复）
                const links = [];
                const taskNameInput = document.getElementById('mergeTaskName');
                let globalName = taskNameInput ? taskNameInput.value.trim() : '';
                rows.forEach((row, idx) => {
                    const url = rawLines[idx];
                    if (!url) return;
                    const quota = Math.max(1, parseInt(row.querySelector('.merge-quota-input').value, 10) || 1);
                    const name = row.querySelector('.merge-name-input').value.trim();
                    if (name && !globalName) globalName = name;
                    for (let i = 0; i < quota; i++) {
                        links.push(url);
                    }
                });

                if (links.length === 0) {
                    alert('未找到有效的链接！');
                    return;
                }

                // 通过在线表格接口创建共享ID，确保不同设备都可访问。
                const id = await createOnlineSet(links, globalName);

                // 生成完整的短链接URL
                const mergedUrl = buildShortUrl(id);

                // 显示结果
                const outputDiv = document.getElementById('mergeOutput');
                outputDiv.innerHTML = `
                    <div class="link-box">
                        <label>✅ 成功生成短链接！(${links.length} 个分配槽，共 ${rawLines.length} 个链接)</label>
                        ${globalName ? `<div class="muted-note" style="margin-top:8px;font-size:13px;color:#555;">任务名称：${globalName}</div>` : ''}
                        <input type="text" value="${mergedUrl}" readonly style="margin-top: 10px; font-size: 14px;">
                        <button class="copy-btn" onclick="copyToClipboard(this)">📋 复制链接</button>
                        <button onclick="setStatsId('${id}')">📊 查看该链接统计</button>
                        <div class="success-msg">✨ 极短链接已生成，用户每次访问直接跳转到下一个网址</div>
                    </div>
                `;

                prefillStatsId(id);
                fetchHistory();

            } catch (error) {
                if (handleAuthFailure(error)) {
                    return;
                }
                console.error('生成链接时出错：', error);
                alert('生成链接时出错：' + error.message);
            }
        }

        function copyText(text, button) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    if (!button) return;
                    const oldText = button.textContent;
                    button.textContent = '✅ 已复制！';
                    setTimeout(() => {
                        button.textContent = oldText;
                    }, 2000);
                });
                return;
            }

            const temp = document.createElement('textarea');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);

            if (button) {
                const oldText = button.textContent;
                button.textContent = '✅ 已复制！';
                setTimeout(() => {
                    button.textContent = oldText;
                }, 2000);
            }
        }

        function copyToClipboard(button) {
            const input = button.previousElementSibling;
            copyText(input.value, button);
        }

        function openDistributedLink() {
            const input = document.getElementById('distributeInput').value.trim();
            if (!input) {
                alert('请粘贴链接！');
                return;
            }

            const workerMatch = input.match(/\/r\/([a-zA-Z0-9_-]{4,64})(?:[/?#]|$)/);
            const hashMatch = input.match(/#([a-zA-Z0-9_-]{4,64})(?:\?|$)/);
            const rawIdMatch = input.match(/^[a-zA-Z0-9_-]{4,64}$/);
            const id = (workerMatch && workerMatch[1]) || (hashMatch && hashMatch[1]) || (rawIdMatch && rawIdMatch[0]) || null;

            if (!id) {
                alert('无效的链接格式！请粘贴 Worker 短链、旧版 # 短链，或直接输入链接ID。');
                return;
            }

            window.location.href = buildShortUrl(id);
        }

        document.getElementById('historyOutput').textContent = '登录后可查看当前账号的历史记录。';
        // 注册/登录切换逻辑
        let authMode = 'login'; // 'login' or 'register'
        function toggleAuthMode(e) {
            e.preventDefault();
            authMode = authMode === 'login' ? 'register' : 'login';
            document.getElementById('auth-title').textContent = authMode === 'login' ? '🔒 登录' : '📝 注册';
            document.getElementById('auth-action-btn').textContent = authMode === 'login' ? '登录' : '注册';
            document.getElementById('toggle-auth-mode').textContent = authMode === 'login' ? '没有账号？注册' : '已有账号？登录';
            document.getElementById('auth-error').textContent = '';
        }
        document.getElementById('auth-password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleAuthAction();
        });
        window.toggleAuthMode = toggleAuthMode;
        async function fetchUserList() {
            const output = document.getElementById('userListOutput');
            output.className = 'empty-text';
            output.textContent = '加载中...';

            try {
                const payload = await apiPost({ action: 'listUsers' });
                const users = payload.users || [];

                if (users.length === 0) {
                    output.className = 'empty-text';
                    output.textContent = '暂无用户。';
                    return;
                }

                output.className = '';
                const rows = users.map(user => {
                    const isAdmin = user.role === 'admin';
                    const canRevoke = !isAdmin;
                    const statusBadge = user.is_authorized
                        ? '<span class="badge badge-green">已授权</span>'
                        : '<span class="badge badge-red">未授权</span>';
                    const roleBadge = isAdmin
                        ? ' <span class="badge badge-blue">管理员</span>'
                        : '';
                    const regTime = user.created_at ? new Date(user.created_at).toLocaleString() : '-';
                    const actionBtns = [
                        !user.is_authorized ? `<button class="mini-btn" style="padding:4px 9px;font-size:12px;" onclick="authorizeUser(${user.id})">授权</button>` : '',
                        canRevoke && user.is_authorized ? `<button class="mini-btn danger-btn" style="padding:4px 9px;font-size:12px;" onclick="revokeUser(${user.id})">禁用</button>` : '',
                        `<button class="mini-btn secondary-btn" style="padding:4px 9px;font-size:12px;" onclick="setUserPassword(${user.id}, '${String(user.username || '').replace(/'/g, "&#39;")}')">改密码</button>`
                    ].join('');
                    return `<tr>
                        <td><strong>${user.username}</strong>${roleBadge}</td>
                        <td>${statusBadge}</td>
                        <td style="color:#888;font-size:12px;">${regTime}</td>
                        <td style="white-space:nowrap;">${actionBtns}</td>
                    </tr>`;
                }).join('');

                output.innerHTML = `
                    <table class="user-table">
                        <thead><tr>
                            <th>用户名</th>
                            <th>状态</th>
                            <th>注册时间</th>
                            <th>操作</th>
                        </tr></thead>
                        <tbody>${rows}</tbody>
                    </table>`;
            } catch (error) {
                output.className = 'empty-text';
                output.textContent = '加载失败：' + (error.message || '未知错误');
            }
        }

        async function authorizeUser(userId) {
            if (!confirm('确定要授权这个账号吗？')) return;

            try {
                await apiPost({ action: 'authorizeUser', userId });
                alert('授权成功');
                fetchUserList();
            } catch (error) {
                alert('授权失败：' + (error.message || '未知错误'));
            }
        }

        async function revokeUser(userId) {
            if (!confirm('确定要禁用这个账号吗？')) return;

            try {
                await apiPost({ action: 'revokeUser', userId });
                alert('禁用成功');
                fetchUserList();
            } catch (error) {
                alert('禁用失败：' + (error.message || '未知错误'));
            }
        }

        async function setUserPassword(userId, username) {
            const newPassword = prompt('请输入 ' + username + ' 的新密码');
            if (newPassword == null) return;

            const trimmedPassword = String(newPassword).trim();
            if (!trimmedPassword) {
                alert('新密码不能为空');
                return;
            }

            try {
                await apiPost({ action: 'setUserPassword', userId, newPassword: trimmedPassword });

                if (currentUser && Number(currentUser.id) === Number(userId)) {
                    setStoredUser({
                        username: currentUser.username,
                        password: trimmedPassword,
                        role: currentUser.role,
                        id: currentUser.id
                    });
                }

                alert('密码修改成功');
                fetchUserList();
            } catch (error) {
                alert('密码修改失败：' + (error.message || '未知错误'));
            }
        }

        function togglePanel(header) {
            const content = header.nextElementSibling;
            const isCollapsed = header.classList.contains('collapsed');
            if (isCollapsed) {
                header.classList.remove('collapsed');
                content.classList.remove('collapsed');
                const title = (header.textContent || '').trim();
                if (title.includes('历史记录') && currentUser && !historyLoaded) {
                    fetchHistory(0);
                }
            } else {
                header.classList.add('collapsed');
                content.classList.add('collapsed');
            }
        }

        setupQuotaButtons();
        loadDomainOptions();
        restoreLogin();
    </script>
</body>
</html>
